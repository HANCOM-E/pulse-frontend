# CodeRabbit 설정. 기본은 기본 브랜치(main)로 가는 PR만 자동 리뷰하므로,
# feature -> dev 흐름을 쓰는 우리 레포는 dev도 리뷰 대상에 추가한다.
# 문서: https://docs.coderabbit.ai/configuration/auto-review
reviews:
  auto_review:
    enabled: true
    base_branches:
      - "main"
      - "dev"
  path_instructions:
    - path: "app/**/*.{ts,tsx}"
      instructions: |
        - import는 `@/` 절대경로만 사용한다. 2단계 이상 상대경로(`../../`)는 금지.
        - 핸들러 함수는 `handle*`, 컴포넌트 prop 콜백은 `on*`으로 명명한다 (예: `<Btn onClick={handleClick} />`).
        - CSS 길이 단위: 폰트·간격은 `rem`, 비율은 `%`, 풀스크린 섹션만 `dvh`를 사용한다. `px`는 1px 고정값(border 등)에만 사용한다.
